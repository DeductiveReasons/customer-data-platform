<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eric Health Campaign Console</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#16202e;--muted:#5d6b7e;--line:#dfe4ea;--accent:#0b6e6e;--accent-soft:#dcefee;--bad:#b42318;--good:#1a7f4b;--warn:#a15c07;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--panel:#18202a;--text:#e8edf3;--muted:#9aa8b8;--line:#2c3744;--accent:#58c4bd;--accent-soft:#1c3a3a;--bad:#f97066;--good:#4cc38a;--warn:#f2b64d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;position:sticky;top:0;z-index:2}
header strong{font-size:16px}
nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:6px 10px;font:inherit;cursor:pointer}
nav button.on{color:var(--text);border-color:var(--accent);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
.notice{background:var(--accent-soft);border-radius:8px;padding:9px 13px;margin-bottom:18px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}
.tile b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.panel{margin-bottom:18px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.link{cursor:pointer}tr.link:hover{background:var(--accent-soft)}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 60px;gap:10px;align-items:center;margin-bottom:7px;font-size:14px}
.bar i{display:block;height:13px;background:var(--accent);border-radius:3px;min-width:2px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.images figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.images img{display:block;width:100%;aspect-ratio:2/1}.images figcaption{padding:7px 9px;font-size:12px;color:var(--muted)}.images figcaption b{display:block;color:var(--text);font-size:13px}.thumb{width:72px;aspect-ratio:2/1;display:block;border-radius:4px}
.profile{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:700;flex:none}.who{flex:1;min-width:210px}.who h1{margin:0}.who p{margin:2px 0}.nextimg{margin:0;width:190px;max-width:100%}.nextimg img{width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:6px;display:block}.nextimg figcaption{font-size:12px;color:var(--muted)}.details{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 18px;margin:0}.details dt{color:var(--muted);font-size:13px}.details dd{margin:0}.msg{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.msgbody{flex:1;min-width:230px}.msgframe{width:100%;height:430px;border:1px solid var(--line);border-radius:6px;background:#fff}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.vcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:0 0 12px;overflow:hidden}.vcard>img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover}.vcard .vb{padding:10px 12px 0;font-size:14px}.vcard .vb b{display:block}.vactions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.approved{background:#d9f2e3;color:#116b3a;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600}.pending{background:#fbeccb;color:#8a5200;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600}.vframe{width:100%;height:560px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:8px}.pager{display:flex;gap:10px;align-items:center;margin-top:14px}
.asset iframe{width:100%;height:340px;border:1px solid var(--line);border-radius:6px;background:#fff}
.asset h2{margin-bottom:2px}
.tag{display:inline-block;background:var(--accent-soft);border-radius:5px;padding:0 7px;font-size:12px}
.seg{display:flex;gap:6px;margin:9px 0}
button.small,select,input{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:5px 9px}
button.small{cursor:pointer}button.small.on{background:var(--accent-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ok{color:var(--good);font-weight:600}.alert{color:var(--bad);font-weight:600}.wait{color:var(--warn);font-weight:600}
.login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.login input{width:100%;margin:10px 0}.login button{width:100%;background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:8px;font:inherit;font-weight:600;cursor:pointer}
.error{color:var(--bad)}.muted{color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>Eric Health Campaign Console</h1>
  <p class="muted">Demo with simulated data. Enter your password to continue.</p>
  <form id="loginForm">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p id="loginError" class="error" role="alert"></p>
  </form>
</div>
<div id="app" hidden>
  <header>
    <strong>Eric Health Console</strong>
    <nav id="nav" aria-label="Views"></nav>
    <button class="small" id="signout">Sign out</button>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<script>
const VIEWS={overview:'Overview',performance:'Performance',variations:'Digital assets',assets:'Campaigns',content:'Image library',people:'People',monitoring:'Monitoring',usage:'Usage and costs'};
const STATUSES={active:'Active journey',onboarding_due:'Onboarding due',registered:'Registered',journey_complete:'Journey complete',no_marketing_consent:'No marketing consent',no_contact_option:'No contact option'};
const LABELS={email:'Email',direct_mail:'Direct mail',no_contact:'No contact'};
const when=v=>{if(!v)return '–';const d=new Date(v);return isNaN(d)?v:d.toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
let password=null,currentView='overview',assetNames={};
try{password=sessionStorage.getItem('pw')}catch(e){}
const view=document.getElementById('view');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number(v||0).toLocaleString();
const pct=(a,b)=>Number(b)?(100*Number(a)/Number(b)).toFixed(1)+'%':'–';
const assetName=id=>assetNames[id]||String(id??'–').replace(/_/g,' ');
async function api(path){
  const r=await fetch(path,{headers:{Authorization:'Bearer '+password}});
  if(r.status===401){signOut('That password did not work.');throw new Error('unauthorized')}
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Could not load this view.');
  return d;
}
function signOut(msg){password=null;try{sessionStorage.removeItem('pw')}catch(e){}
  document.getElementById('app').hidden=true;document.getElementById('login').hidden=false;
  document.getElementById('loginError').textContent=msg||''}
function table(cols,rows,opts={}){
  if(!rows.length)return `<p class="muted">${esc(opts.empty||'No data yet.')}</p>`;
  return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}" scope="col">${esc(c.t)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr ${opts.link?`class="link" tabindex="0" data-id="${esc(r[opts.link])}"`:''}>${cols.map(c=>`<td class="${c.n?'n':''}">${c.h?c.h(r):esc(c.f?c.f(r):r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function funnelTotals(rows){const t={delivered:0,opened:0,clicked:0,registered:0,unsubscribed:0};
  rows.forEach(r=>Object.keys(t).forEach(k=>t[k]+=Number(r[k]||0)));return t}
const funnelCols=[
 {t:'Asset',f:r=>assetName(r.asset_id)},{t:'Channel',f:r=>LABELS[r.channel]||r.channel},
 {t:'Delivered',k:'delivered',n:1,f:r=>num(r.delivered)},
 {t:'Open rate',n:1,f:r=>r.channel==='direct_mail'?'n/a':pct(r.opened,r.delivered)},
 {t:'Click rate',n:1,f:r=>pct(r.clicked,r.delivered)},
 {t:'Registered',n:1,f:r=>num(r.registered)},
 {t:'Sign-up rate',n:1,f:r=>pct(r.registered,r.delivered)},
 {t:'Unsubscribed',n:1,f:r=>num(r.unsubscribed)}];
const render={
 async overview(){
  const d=await api('/api/overview'),t=d.totals||{},f=funnelTotals(d.funnel),max=Math.max(1,...d.statuses.map(s=>Number(s.people)));
  return `<h1>Overview</h1><p class="sub">People snapshot: ${esc(t.snapshot_at||'not exported yet')} · Model: ${esc(t.model_version||'–')}</p>
  <div class="tiles">
   <div class="tile"><b>${num(t.people)}</b><span>People</span></div>
   <div class="tile"><b>${num(t.contacted)}</b><span>Contacted</span></div>
   <div class="tile"><b>${num(t.registered)}</b><span>Registered</span></div>
   <div class="tile"><b>${pct(t.registered,t.people)}</b><span>Registration rate, all people</span></div>
   <div class="tile"><b>${pct(t.registered,t.contacted)}</b><span>Registration rate, contacted</span></div>
   <div class="tile"><b>${num(f.delivered)}</b><span>Messages delivered</span></div>
  </div>
  <div class="panel"><h2>Next best action</h2>${(d.actions||[]).map(a=>`<div class="bar"><span>${esc(LABELS[a.action]||a.action||'Not exported')}</span><i style="width:${(100*Number(a.people)/Math.max(1,Number(t.people))).toFixed(1)}%"></i><em>${num(a.people)}</em></div>`).join('')||'<p class="muted">No people yet.</p>'}</div>
  <div class="panel"><h2>People by status</h2>${d.statuses.map(s=>`<div class="bar"><span>${esc(STATUSES[s.status]||s.status)}</span><i style="width:${(100*Number(s.people)/max).toFixed(1)}%"></i><em>${num(s.people)}</em></div>`).join('')||'<p class="muted">No people yet.</p>'}</div>
  <div class="panel"><h2>Endpoint library</h2><p class="muted">The dummy receiver never sends real email or mail. Keys, tokens and passwords are kept in AWS and are not shown here.</p>${table([{t:'Area',k:'group'},{t:'Method',k:'method'},{t:'Endpoint',k:'url'},{t:'Sign-in',k:'auth'},{t:'What it does',k:'purpose'}],d.endpoints||[])}</div>`;
 },
 async performance(){
  const d=await api('/api/performance');
  return `<h1>Performance</h1><p class="sub">Simulated results by asset and channel.</p>
  <div class="panel"><h2>Funnel by asset and channel</h2>${table(funnelCols,d.funnel)}</div>
  <div class="panel"><h2>Current next best actions</h2>${table([
   {t:'Asset',f:r=>assetName(r.asset_id)},{t:'Channel',f:r=>LABELS[r.channel]||r.channel},
   {t:'People',n:1,f:r=>num(r.people)},{t:'Avg. propensity',n:1,f:r=>(100*Number(r.avg_propensity)).toFixed(1)+'%'},
   {t:'Avg. expected value',n:1,f:r=>'$'+Number(r.avg_expected_value).toFixed(2)}],d.next_actions)}</div>`;
 },
 async assets(){
  const d=await api('/api/assets');
  const after=()=>{document.querySelectorAll('.asset').forEach(card=>{
    card.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{
      card.querySelectorAll('[data-ch]').forEach(x=>x.classList.toggle('on',x===b));
      card.querySelector('iframe').srcdoc=d.assets.find(a=>a.id===card.dataset.id)[b.dataset.ch+'_html']})})};
  view._after=after;
  return `<h1>Campaigns</h1><p class="sub">${esc(d.brand.disclaimer)} Goal: ${esc(d.brand.goal)}.</p><div class="assets">${d.assets.map(a=>{
   const rows=d.funnel.filter(r=>r.asset_id===a.id),t=funnelTotals(rows);
   return `<article class="panel asset" data-id="${esc(a.id)}"><h2>${esc(a.name)}</h2><span class="tag">${esc(a.stage)}</span>
    <p class="muted">${esc(a.subject)}</p><p>${num(t.delivered)} delivered · ${num(t.registered)} registered · ${pct(t.registered,t.delivered)} sign-up rate</p>
    <div class="seg"><button class="small on" data-ch="email">Email</button><button class="small" data-ch="direct_mail">Direct mail</button></div>
    <iframe sandbox title="${esc(a.name)} preview" srcdoc="${esc(a.email_html)}"></iframe></article>`}).join('')}</div>`;
 },
 async variations(params={}){
  const q=new URLSearchParams();['asset','channel','theme','status','page'].forEach(k=>{if(params[k])q.set(k,params[k])});
  const d=await api('/api/variations?'+q),pages=Math.max(1,Math.ceil(d.matching/d.page_size));
  const opts=(map,cur)=>Object.entries(map).map(([k,v])=>`<option value="${esc(k)}" ${cur===k?'selected':''}>${esc(v)}</option>`).join('');
  view._after=()=>{
   const read=page=>({asset:document.getElementById('fa').value,channel:document.getElementById('fc').value,theme:document.getElementById('ft').value,status:document.getElementById('fs').value,page});
   ['fa','fc','ft','fs'].forEach(i=>document.getElementById(i).onchange=()=>show('variations',read(1)));
   const nav=(id,page)=>{const b=document.getElementById(id);if(b)b.onclick=()=>show('variations',read(page))};nav('pv',d.page-1);nav('nx',d.page+1);
   document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const v=d.variations[Number(b.dataset.open)],f=document.getElementById('vf'+b.dataset.open);f.hidden=!f.hidden;b.textContent=f.hidden?'Preview':'Hide preview';if(!f.hidden&&!f.srcdoc)f.srcdoc=v.html});
   document.querySelectorAll('[data-set]').forEach(b=>b.onclick=async()=>{b.disabled=true;const v=d.variations[Number(b.dataset.i)];
    try{const r=await fetch('/api/variations/'+encodeURIComponent(v.id)+'/status',{method:'POST',headers:{Authorization:'Bearer '+password,'Content-Type':'application/json'},body:JSON.stringify({status:b.dataset.set})});if(!r.ok)throw new Error();show('variations',params)}
    catch(e){b.disabled=false;b.textContent='Could not save. Try again'}})};
  return `<h1>Digital assets</h1><p class="sub">Every deliverable variation: ${num(d.total)} combinations of asset, channel and image. Variations are auto-approved for now. Pending variations are not sent.</p>
  <div class="tiles"><div class="tile"><b>${num(d.total)}</b><span>Variations</span></div><div class="tile"><b>${num(d.totals.approved)}</b><span>Approved</span></div><div class="tile"><b>${num(d.totals.pending_approval)}</b><span>Pending approval</span></div></div>
  <div class="filters"><label>Asset <select id="fa"><option value="">All</option>${opts(d.assets,params.asset)}</select></label>
  <label>Channel <select id="fc"><option value="">All</option>${opts({email:'Email',direct_mail:'Direct mail'},params.channel)}</select></label>
  <label>Theme <select id="ft"><option value="">All</option>${opts(d.themes,params.theme)}</select></label>
  <label>Status <select id="fs"><option value="">All</option>${opts({approved:'Approved',pending_approval:'Pending approval'},params.status)}</select></label></div>
  <p class="muted">${num(d.matching)} matching · Page ${d.page} of ${pages}</p>
  <div class="vgrid">${d.variations.map((v,i)=>`<article class="vcard"><img loading="lazy" src="/images/${esc(v.image_id)}.jpg" alt="${esc(v.theme)} image">
   <div class="vb"><b>${esc(v.asset)}</b>${esc(LABELS[v.channel])} · ${esc(v.theme)}<br><span class="muted">${esc(v.subject)}</span><br>CTA: ${esc(v.cta)}<br>
   <span class="${v.status==='approved'?'approved':'pending'}">${v.status==='approved'?'Approved':'Pending approval'}</span> <span class="muted">${esc(v.changed_by)}</span>
   <div class="vactions"><button class="small" data-open="${i}">Preview</button>${v.status==='approved'?`<button class="small" data-set="pending_approval" data-i="${i}">Set to pending</button>`:`<button class="small" data-set="approved" data-i="${i}">Approve</button>`}</div>
   <iframe id="vf${i}" hidden sandbox class="vframe" title="${esc(v.asset)} preview"></iframe></div></article>`).join('')||'<p class="muted">No matching variations.</p>'}</div>
  <div class="pager">${d.page>1?'<button class="small" id="pv">Previous</button>':''}${d.page<pages?'<button class="small" id="nx">Next</button>':''}</div>`;
 },
 async content(){
  const d=await api('/api/content');
  const themes={};d.images.forEach(i=>{const t=themes[i.theme]=themes[i.theme]||{label:i.label,tone:i.tone,delivered:0,clicked:0,registered:0};t.delivered+=i.delivered;t.clicked+=i.clicked;t.registered+=i.registered});
  const rows=Object.values(themes).sort((a,b)=>(b.clicked/(b.delivered||1))-(a.clicked/(a.delivered||1)));
  return `<h1>Image library</h1><p class="sub">${d.images.length} AI-generated sample images in ${rows.length} themes. A model picks the theme for each person, and results are simulated.</p>
  <div class="panel"><h2>Results by theme</h2>${table([{t:'Theme',k:'label'},{t:'Tone',k:'tone'},{t:'Delivered',n:1,f:r=>num(r.delivered)},{t:'Click rate',n:1,f:r=>pct(r.clicked,r.delivered)},{t:'Registered',n:1,f:r=>num(r.registered)}],rows)}</div>
  <div class="images">${d.images.map(i=>`<figure><img loading="lazy" src="/images/${esc(i.id)}.jpg" alt="${esc(i.label)} image"><figcaption><b>${esc(i.id)}</b>${num(i.delivered)} sent · ${pct(i.clicked,i.delivered)} clicked</figcaption></figure>`).join('')}</div>`;
 },
 async people(params={}){
  const q=new URLSearchParams();if(params.status)q.set('status',params.status);if(params.customer_id)q.set('customer_id',params.customer_id);
  const d=await api('/api/people?'+q);
  view._after=()=>{
   const go=()=>show('people',{status:document.getElementById('st').value,customer_id:document.getElementById('cid').value.trim()});
   document.getElementById('st').onchange=go;document.getElementById('cf').onsubmit=e=>{e.preventDefault();go()};
   document.querySelectorAll('tr.link').forEach(r=>{const open=()=>show('person',{id:r.dataset.id});r.onclick=open;r.onkeydown=e=>{if(e.key==='Enter')open()}})};
  return `<h1>People</h1><p class="sub">Simulated people. Shows up to ${d.limit}, highest expected value first. Select a row for history.</p>
  <div class="panel"><form class="filters" id="cf"><label>Status <select id="st"><option value="">All</option>${Object.entries(STATUSES).map(([k,v])=>`<option value="${k}" ${params.status===k?'selected':''}>${esc(v)}</option>`).join('')}</select></label>
  <label>Customer ID <input id="cid" value="${esc(params.customer_id||'')}"></label><button class="small">Search</button></form>
  ${table([{t:'Customer',k:'customer_id'},{t:'Name',f:r=>`${r.first_name||''} ${r.last_name||''}`},{t:'Status',f:r=>STATUSES[r.status]||r.status},
   {t:'Touches',k:'touches',n:1},{t:'Clicks',k:'clicks',n:1},{t:'Registered',f:r=>r.registered==='true'?'Yes':'No'},
   {t:'Next best action',f:r=>LABELS[r.next_best_action]||'–'},{t:'Next action time',f:r=>when(r.next_best_action_time)},{t:'Asset',f:r=>r.next_best_asset?assetName(r.next_best_asset):'–'},{t:'Next image',h:r=>r.next_best_image?`<img class="thumb" src="/images/${esc(r.next_best_image)}.jpg" alt="${esc(r.next_best_image)}">`:'–'},
   {t:'Propensity',n:1,f:r=>r.next_best_propensity?(100*Number(r.next_best_propensity)).toFixed(1)+'%':'–'}],d.people,{link:'customer_id',empty:'No matching people.'})}</div>`;
 },
 async person(params){
  const d=await api('/api/people/'+encodeURIComponent(params.id));
  const yn=v=>v==='true'?'Yes':v==='false'?'No':'–';
  const p100=v=>v==null||v===''?'–':(100*Number(v)).toFixed(1)+'%';
  const back='<button class="small" id="back">Back to people</button>';
  view._after=()=>{document.getElementById('back').onclick=()=>show('people');
   document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
    const m=d.history[Number(b.dataset.view)],f=document.getElementById('msg'+b.dataset.view);
    f.hidden=!f.hidden;b.textContent=f.hidden?'View':'Hide';if(!f.hidden&&!f.srcdoc)f.srcdoc=m.content_html})};
  if(!d.profile)return `${back}<div class="panel" style="margin-top:12px"><p>No profile found for ${esc(params.id)}.</p></div>`;
  const u=d.profile,name=`${u.first_name||''} ${u.last_name||''}`.trim()||'Unknown';
  const initials=name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const hue=[...String(u.customer_id)].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
  const detail=(k,v)=>`<div><dt>${esc(k)}</dt><dd>${esc(v??'–')}</dd></div>`;
  const best=d.offers[0];
  return `${back}
  <section class="panel profile" style="margin-top:12px">
   <div class="avatar" role="img" aria-label="Avatar for ${esc(name)}" style="background:hsl(${hue} 55% 38%)">${esc(initials)}</div>
   <div class="who"><h1>${esc(name)}</h1><p class="muted">${esc(u.customer_id)} · ${esc(STATUSES[u.status]||u.status)}</p>
    <p class="muted">Simulated person. Avatar is generated from their initials.</p></div>
   ${u.next_best_image?`<figure class="nextimg"><img src="/images/${esc(u.next_best_image)}.jpg" alt="${esc(u.next_best_image_theme||'')} image"><figcaption>Next image: ${esc(u.next_best_image)}</figcaption></figure>`:''}
  </section>
  <div class="tiles">
   <div class="tile"><b>${esc(LABELS[u.next_best_action]||'–')}</b><span>Next best action${u.no_contact_reason?': '+esc(STATUSES[u.no_contact_reason]||u.no_contact_reason):''}</span></div>
   <div class="tile"><b style="font-size:19px">${esc(when(u.next_best_action_time))}</b><span>Next action time (your local time)</span></div>
   <div class="tile"><b style="font-size:19px">${u.next_best_asset?esc(assetName(u.next_best_asset)):'None'}</b><span>Next asset</span></div>
   <div class="tile"><b>${p100(u.next_best_propensity)}</b><span>Sign-up propensity</span></div>
   <div class="tile"><b>${u.next_best_expected_value?'$'+Number(u.next_best_expected_value).toFixed(2):'–'}</b><span>Expected value</span></div>
   <div class="tile"><b>${num(u.touches)} / ${num(u.opens)} / ${num(u.clicks)}</b><span>Sent / opened / clicked</span></div>
   <div class="tile"><b>${yn(u.registered)}</b><span>Registered</span></div>
  </div>
  <div class="panel"><h2>Profile</h2><dl class="details">
   ${detail('First name',u.first_name)}${detail('Last name',u.last_name)}${detail('Email',u.email)}${detail('Address',[u.address,u.city,u.state,u.postal_code].filter(Boolean).join(', '))}${detail('Age',u.age)}${detail('Member for',u.tenure_months?u.tenure_months+' months':null)}
   ${detail('App sessions, 30 days',u.app_sessions_30d)}${detail('Days since active',u.days_since_active)}${detail('Email open rate',p100(u.email_open_rate))}${detail('Wellness member',u.wellness_member==='1'?'Yes':'No')}
   ${detail('Marketing consent',yn(u.consent_marketing))}${detail('Email consent',yn(u.consent_email))}${detail('Direct mail consent',yn(u.consent_direct_mail))}${detail('Model',u.model_version)}
  </dl></div>
  <div class="panel"><h2>Offer propensity scores, right now</h2>${table([{t:'Asset',f:r=>assetName(r.asset_id)},{t:'Channel',f:r=>LABELS[r.channel]||r.channel},{t:'Sign-up propensity',n:1,f:r=>p100(r.propensity)},{t:'Expected value',n:1,f:r=>'$'+Number(r.expected_value).toFixed(2)}],d.offers,{empty:'No scores, because this person has not given consent for any channel.'})}</div>
  <div class="panel"><h2>Image theme scores, right now</h2>${d.themes.map(t=>`<div class="bar"><span>${esc(t.label)}</span><i style="width:${(100*t.click_score/Math.max(.001,d.themes[0].click_score)).toFixed(1)}%"></i><em>${p100(t.click_score)}</em></div>`).join('')}</div>
  <div class="panel"><h2>Previous messages</h2><p class="muted">Previews use the current email design and copy. Earlier sends may have looked different.</p>${d.history.length?d.history.map((m,i)=>`<article class="msg">
    ${m.image_id?`<img class="thumb" src="/images/${esc(m.image_id)}.jpg" alt="${esc(m.image_id)}">`:''}
    <div class="msgbody"><b>${esc(assetName(m.asset_id))}</b> · ${esc(LABELS[m.channel]||m.channel)} · touch ${esc(m.touch)}
     <div class="muted">${esc(m.decided_at||'')} · ${esc(m.selection||'')} · ${esc(m.trigger||'')}</div>
     <div>Communication type: ${esc(LABELS[m.channel]||m.channel)} · Propensity ${p100(m.propensity)} · Image score ${p100(m.content_score)} · ${esc(m.image_theme||'no image')}</div>
     <div>Opened ${m.channel==='direct_mail'?'n/a':yn(m.opened)} · Clicked ${yn(m.clicked)} · Registered ${yn(m.registered)} · Unsubscribed ${yn(m.unsubscribed)}</div></div>
    ${m.content_html?`<button class="small" data-view="${i}">View</button>`:''}
    <iframe id="msg${i}" hidden sandbox title="Message ${esc(m.touch)} content" class="msgframe"></iframe></article>`).join(''):'<p class="muted">No messages sent to this person.</p>'}</div>`;
 },
 async usage(){
  const d=await api('/api/usage'),r=d.records||{};
  const money=v=>'$'+Number(v||0).toFixed(Number(v)>0&&Number(v)<1?4:2);
  const size=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':b>=1024?(b/1024).toFixed(0)+' KB':num(b)+' B';
  const missing=d.unavailable.length?`<div class="notice" role="status">Not available right now: ${esc(d.unavailable.join(', '))}.</div>`:'';
  const files=d.storage.reduce((s,a)=>s+a.files,0),bytes=d.storage.reduce((s,a)=>s+a.bytes,0);
  return `<h1>Usage and costs</h1><p class="sub">Costs cover the whole AWS account${d.costs_from?` since ${esc(d.costs_from)}`:''} and can lag by up to a day. Activity covers the last ${d.activity_days} days.</p>${missing}
  <div class="tiles"><div class="tile"><b>${money(d.total_cost)}</b><span>Cost this month, of $50 budget</span></div>
  <div class="tile"><b>${num(r.people)}</b><span>People</span></div>
  <div class="tile"><b>${num(r.messages_sent)}</b><span>Messages sent (simulated)</span></div>
  <div class="tile"><b>${num(Number(r.email_outcomes||0)+Number(r.direct_mail_outcomes||0))}</b><span>Engagement records</span></div>
  <div class="tile"><b>${size(bytes)}</b><span>Stored in S3, ${num(files)} files</span></div></div>
  <div class="panel"><h2>Services and cost this month</h2>${table([{t:'Service',k:'name'},{t:'Used for',k:'purpose'},{t:'Cost',n:1,f:s=>money(s.cost)}],d.services)}</div>
  <div class="panel"><h2>Records</h2>${table([{t:'Table',k:'t'},{t:'Records',n:1,f:x=>num(x.n)}],[{t:'people',n:r.people},{t:'nba_history',n:r.messages_sent},{t:'email_engagement',n:r.email_outcomes},{t:'direct_mail_engagement',n:r.direct_mail_outcomes},{t:'Image library',n:d.image_count}])}</div>
  <div class="panel"><h2>API calls and activity</h2>${table([{t:'Activity',k:'name'},{t:'Count',n:1,f:x=>num(x.count)}],d.activity)}</div>
  <div class="panel"><h2>S3 storage</h2>${table([{t:'Area',k:'area'},{t:'Files',n:1,f:x=>num(x.files)},{t:'Size',n:1,f:x=>size(x.bytes)}],d.storage)}</div>`;
 },
 async monitoring(){
  const d=await api('/api/monitoring');
  const failed=d.queues.filter(q=>q.failed_queue).reduce((s,q)=>s+q.waiting,0),firing=d.alarms.filter(a=>a.state==='ALARM').length,work=d.queues.filter(q=>!q.failed_queue).reduce((s,q)=>s+q.waiting+q.in_progress,0),errs=d.lambdas.reduce((s,l)=>s+l.errors,0);
  const stateCls=s=>s==='OK'?'ok':s==='ALARM'?'alert':'wait';
  return `<h1>Monitoring</h1><p class="sub"><a href="${esc(d.dashboard_url)}" target="_blank" rel="noopener">Open the CloudWatch dashboard</a></p>
  <div class="tiles"><div class="tile"><b class="${firing?'alert':'ok'}">${firing}</b><span>Alarms firing</span></div>
  <div class="tile"><b class="${failed?'alert':'ok'}">${num(failed)}</b><span>Failed messages</span></div>
  <div class="tile"><b>${num(work)}</b><span>Messages in progress</span></div>
  <div class="tile"><b class="${errs?'alert':'ok'}">${num(errs)}</b><span>Function errors, 24 hours</span></div></div>
  <div class="panel"><h2>Queues</h2>${table([{t:'Queue',k:'name'},{t:'Type',f:q=>q.failed_queue?'Failed messages':'Working'},{t:'Waiting',n:1,h:q=>`<span class="${q.failed_queue&&q.waiting?'alert':''}">${num(q.waiting)}</span>`},{t:'In progress',n:1,f:q=>num(q.in_progress)}],d.queues)}</div>
  <div class="panel"><h2>Functions, last 24 hours</h2>${table([{t:'Function',k:'name'},{t:'Runs',n:1,f:l=>num(l.invocations)},{t:'Errors',n:1,h:l=>`<span class="${l.errors?'alert':''}">${num(l.errors)}</span>`}],d.lambdas)}</div>
  <div class="panel"><h2>Alarms</h2>${table([{t:'Alarm',k:'name'},{t:'State',h:a=>`<span class="${stateCls(a.state)}">${esc(a.state)}</span>`}],d.alarms)}</div>`;
 }
};
async function show(name,params){
  currentView=name;const top=name==='person'?'people':name;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===top));
  view.innerHTML='<p class="muted" role="status">Loading…</p>';view._after=null;
  try{const html=await render[name](params);if(currentView!==name)return;view.innerHTML=html;if(view._after)view._after()}
  catch(e){if(e.message!=='unauthorized')view.innerHTML=`<div class="panel"><p class="error" role="alert">${esc(e.message)}</p><button class="small" id="retry">Try again</button></div>`;
   const r=document.getElementById('retry');if(r)r.onclick=()=>show(name,params)}
}
async function start(){
  document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;
  try{(await api('/api/assets')).assets.forEach(a=>assetNames[a.id]=a.name)}catch(e){if(e.message==='unauthorized')return}
  show('overview');
}
document.getElementById('nav').innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button data-v="${k}">${v}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
document.getElementById('signout').onclick=()=>signOut();
document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();password=document.getElementById('pw').value;
  try{sessionStorage.setItem('pw',password)}catch(err){}document.getElementById('pw').value='';start()};
if(password)start();else document.getElementById('login').hidden=false;
</script>
</body>
</html>
